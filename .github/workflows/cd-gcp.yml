name: CD - Deploy to GCP Cloud Run

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/cd-gcp.yml'
  workflow_dispatch:

env:
  REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION || 'southamerica-east1' }}
  GAR_REPO: ${{ vars.GAR_REPOSITORY || secrets.GAR_REPOSITORY || 'docseq-artifacts' }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || secrets.CLOUD_RUN_SERVICE || 'docseq-backend-api' }}

jobs:
  deploy:
    name: Build, Push & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve and Validate GCP Project ID
        id: config
        run: |
          PROJECT_ID="${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJECT_ID" ]; then
            PROJECT_ID="${{ steps.auth.outputs.project_id }}"
          fi

          if [ -z "$PROJECT_ID" ]; then
            echo "::error::GCP Project ID não encontrado. Cadastre a variável GCP_PROJECT_ID no GitHub (Settings -> Secrets and variables -> Actions -> Variables) ou no GCP_SA_KEY."
            exit 1
          fi

          echo "project_id=${PROJECT_ID}" >> $GITHUB_OUTPUT
          echo "GCP Project ID resolvido: ${PROJECT_ID}"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Image Tag
        id: meta
        run: |
          PROJECT_ID="${{ steps.config.outputs.project_id }}"
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}"
          echo "image=${IMAGE}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "image_latest=${IMAGE}:latest" >> $GITHUB_OUTPUT
          echo "Target Image Tag: ${IMAGE}:${{ github.sha }}"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ steps.meta.outputs.image }}
          project_id: ${{ steps.config.outputs.project_id }}
          flags: |
            --allow-unauthenticated
            --min-instances=0
            --max-instances=10
            --memory=512Mi
            --cpu=1
            --timeout=60s
            --port=8080
            --set-env-vars=APP_ENV=production
            --set-secrets=DATABASE_URL=DOCSEQ_DATABASE_URL:latest,JWT_SECRET=DOCSEQ_JWT_SECRET:latest,DEFAULT_ADMIN_PASSWORD=DOCSEQ_ADMIN_PASSWORD:latest

      - name: Smoke Test & Health Check
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          echo "Verificando saúde do serviço em: ${SERVICE_URL}/health"
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/health" || true)
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Health check falhou com status: $STATUS"
            exit 1
          fi
          echo "✅ Health check bem-sucedido (HTTP $STATUS)!"

      - name: Publish Deployment Summary
        if: always() && steps.deploy.outputs.url != ''
        run: |
          echo "### 🚀 Deploy Realizado com Sucesso no Cloud Run!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL do Backend:** [${{ steps.deploy.outputs.url }}](${{ steps.deploy.outputs.url }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check:** [${{ steps.deploy.outputs.url }}/health](${{ steps.deploy.outputs.url }}/health)" >> $GITHUB_STEP_SUMMARY
          echo "- **API Base:** \`${{ steps.deploy.outputs.url }}/api/v1\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Região:** \`${{ env.REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
